[package]
name = "duanes-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the Duanes framework"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
duanes-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "Headers"] }
getrandom = { version = "0.2", features = ["js"] }

[dependencies.uuid]
workspace = true
features = ["v4", "wasm-bindgen"]

[dependencies.chrono]
workspace = true
features = ["wasmbind"]
