[engine]
default_provider = "openai"
request_timeout_secs = 120
max_retries = 3
retry_delay_ms = 1000

[storage]
backend = "sqlite"
path = "data/duanes.db"

[storage.privacy]
store_prompt = true
store_response = true
store_cost = true
store_provider = true
store_model = true
store_latency = true
store_identity = true
mask_pii = false

[governance]
enabled = true
max_tokens_per_request = 128000
max_tokens_per_user_daily = 1000000
max_cost_per_user_daily = 50.0
allowed_models = ["gpt-4o", "gpt-4o-mini", "gpt-3.5-turbo", "claude-3-5-sonnet"]
blocked_patterns = []

[collector]
endpoint = "http://localhost:9090"
sync_interval_secs = 30
batch_size = 100
retry_on_failure = true

[local_runner]
enabled = false
models_path = "./models"
default_backend = "auto"
max_concurrent_inferences = 2
