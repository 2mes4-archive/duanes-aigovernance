[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duanes-aigovernance"
version = "0.1.0"
description = "Python SDK for Duanes — Inter-application AI Governance Framework"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "2mes4", email = "hello@2mes4.com"},
]
keywords = ["ai", "governance", "openai", "proxy", "edge", "rust", "cost-tracking", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/2mes4/duanes-aigovernance"
Repository = "https://github.com/2mes4/duanes-aigovernance"
Documentation = "https://github.com/2mes4/duanes-aigovernance#readme"
Issues = "https://github.com/2mes4/duanes-aigovernance/issues"

[tool.setuptools.packages.find]
where = ["src"]
