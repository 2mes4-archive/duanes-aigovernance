[package]
name = "duanes-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone HTTP/gRPC proxy server for AI governance"

[[bin]]
name = "duanes-server"
path = "src/main.rs"

[dependencies]
duanes-common = { workspace = true }
duanes-core = { workspace = true }
duanes-storage = { workspace = true }
duanes-local-runner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
anyhow = { workspace = true }
